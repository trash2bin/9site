server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Домена пока нет, отвечаем на любой запрос по IP.
    server_name _;

    access_log /var/log/nginx/9site.access.log;
    error_log  /var/log/nginx/9site.error.log;

    # HTML и CSS жмутся хорошо, а картинки уже сжаты и только потеряют время.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html nginx жмёт сам, повторять его здесь не нужно.
    gzip_types text/css image/svg+xml application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
