# Конфиг сайта 9site. Устанавливает setup-server.sh, он же подставляет домен
# вместо __DOMAIN__: сертификат лежит в папке с именем домена, а в
# ssl_certificate переменные nginx не поддерживает. Домен задаётся один раз,
# в переменной DOMAIN в setup-server.sh.

# Запросы по IP или с чужим Host: сертификата для них нет, поэтому отдаём
# сайт по HTTP как есть. Этот же блок обслуживает проверку http://127.0.0.1/
# после деплоя и любой заход напрямую по адресу сервера.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/9site.access.log;
    error_log  /var/log/nginx/9site.error.log;

    # HTML и CSS жмутся хорошо, а картинки уже сжаты и только потеряют время.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    # text/html nginx жмёт сам, повторять его здесь не нужно.
    gzip_types text/css image/svg+xml application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Наш домен по HTTP: проверку Let's Encrypt отдаём с диска, всё остальное
# уводим на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Проверочные файлы certbot кладёт на диск, и nginx должен отдать их сам.
    # Пропустить их через location / нельзя: Go-сервер отвечает 404 на всё,
    # кроме /, /style.css и /assets/, поэтому проверка падала с 404 и
    # сертификат не выпускался. ^~ обязателен, иначе запрос перехватит
    # location / и уйдёт в редирект на HTTPS.
    #
    # Файлы появляются здесь из certbot --webroot -w /var/www/html,
    # тем же путём ходит и автопродление из certbot.timer.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Директива http2 есть в nginx с 1.25.1, на сервере 1.28.
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # TLS 1.2 оставлен ради старых браузеров, TLS 1.3 включён по умолчанию.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/9site.access.log;
    error_log  /var/log/nginx/9site.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css image/svg+xml application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
