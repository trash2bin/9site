name: Deploy step
description: >-
  Run one deploy/remote/<name>.sh the way the pipeline does, through run.sh
  over ssh as the deploy user, output into the job summary. Each argument is
  one KEY=VALUE, so a path or a restart command with spaces stays intact.

inputs:
  name:
    description: Remote script name, without .sh.
    required: true
  deploy_path:
    default: ""
  probe_url:
    default: ""
  stamp:
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        args=()
        if [ -n "${{ inputs.deploy_path }}" ]; then args+=("DEPLOY_PATH=${{ inputs.deploy_path }}"); fi
        if [ -n "${{ inputs.probe_url }}" ]; then args+=("PROBE_URL=${{ inputs.probe_url }}"); fi
        if [ -n "${{ inputs.stamp }}" ]; then args+=("STAMP=${{ inputs.stamp }}"); fi
        bash deploy/remote/run.sh "${{ inputs.name }}" "${args[@]}" \
          | tee -a "${SUMMARY:-/dev/null}"
