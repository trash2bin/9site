name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Бюджет HTML+CSS в байтах (60 КБ).
  SIZE_LIMIT: "61440"

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Prettier — проверка формата
        run: npm run format:check

      - name: Stylelint — CSS
        run: npm run lint:css

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l main.go)"
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано: $unformatted"
            gofmt -d main.go
            exit 1
          fi
          echo "OK"

      - name: go vet
        run: go vet ./...

      - name: Сборка сервера
        run: go build -o /tmp/site-server .

      - name: Бюджет HTML+CSS
        run: bash scripts/check-size.sh

  # Деплой включается только когда на сервере всё готово:
  # заведи repository variable DEPLOY_ENABLED=true и секреты SSH_* (см. README).
  deploy:
    name: Деплой
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Обязательны только SSH_HOST и SSH_PRIVATE_KEY. Остальное
      # подставляется по умолчанию, переопределять не нужно.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/9site' }}
      RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD || 'sudo systemctl restart 9site' }}
      TARGET: ${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}
      SSH_OPTS: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=yes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Собрать сервер под Linux
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o build/site-server .

      - name: Настроить SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "ключ на месте"

      - name: Залить статику
        run: |
          set -euo pipefail
          rsync -avz -e "$SSH_OPTS" \
            index.html style.css "$TARGET:$DEPLOY_PATH/"
          rsync -avz --delete-after -e "$SSH_OPTS" \
            assets/ "$TARGET:$DEPLOY_PATH/assets/"

      - name: Залить бинарник
        run: |
          set -euo pipefail
          rsync -avz -e "$SSH_OPTS" build/site-server "$TARGET:/tmp/site-server.new"
          # Ставим рядом и подменяем через mv: переименование в пределах
          # одной файловой системы атомарно, поэтому сервис ни на миг не
          # остаётся без бинарника и не ловит Text file busy.
          $SSH_OPTS "$TARGET" "
            install -m 755 /tmp/site-server.new '$DEPLOY_PATH/site-server.new' &&
            mv -f '$DEPLOY_PATH/site-server.new' '$DEPLOY_PATH/site-server' &&
            rm -f /tmp/site-server.new
          "

      - name: Перезапустить сервис
        run: $SSH_OPTS "$TARGET" "$RESTART_CMD"

      # Проверяем не только что процесс запустился, но и что он отвечает
      # по-настоящему: сайт отдаётся, а закрытые файлы остаются закрытыми.
      - name: Проверить, что сайт отвечает
        run: |
          set -euo pipefail

          check() {
            local url="$1" want="$2" code
            code="$($SSH_OPTS "$TARGET" "curl -s -o /dev/null -w '%{http_code}' '$url'" || true)"
            printf '  %-34s %s\n' "$url" "${code:-нет ответа}"
            if [ "$code" != "$want" ]; then
              echo "Ожидался код $want, получен ${code:-нет ответа}"
              return 1
            fi
          }

          check http://127.0.0.1:8080/           200
          check http://127.0.0.1:8080/style.css  200
          check http://127.0.0.1:8080/main.go    404
          check http://127.0.0.1:8080/visits.dat 404
          check http://127.0.0.1/                200

      # Счётчик — единственное живое место на сайте, поэтому проверяем
      # не код ответа, а что число действительно растёт от захода к заходу.
      - name: Проверить счётчик визитов
        run: |
          set -euo pipefail

          # Каждый вызов — ровно один запрос к главной, поэтому число
          # внутри .counter обязано увеличиться на единицу.
          visits() {
            $SSH_OPTS "$TARGET" "curl -s http://127.0.0.1:8080/" \
              | tr -d '\n' \
              | awk -F'class="counter"' '{print $2}' \
              | head -c 200 \
              | grep -o '<span>[0-9]</span>' | grep -o '[0-9]' | tr -d '\n'
          }

          first="$(visits)"
          second="$(visits)"
          printf '  до: %s, после: %s\n' "$first" "$second"

          if [ -z "$first" ] || [ -z "$second" ]; then
            echo "Счётчик не найден в ответе"
            exit 1
          fi

          # 10# — иначе bash примет ведущие нули за восьмеричную запись
          # и упадёт на числе вроде 008.
          diff=$((10#$second - 10#$first))
          if [ "$diff" != "1" ]; then
            echo "Ожидался рост на 1, получен $diff"
            exit 1
          fi
          echo "Счётчик увеличивается"

      - name: Итог
        run: echo "Задеплоен коммит ${{ github.sha }}"
