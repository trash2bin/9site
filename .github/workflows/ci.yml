name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # HTML+CSS budget in bytes (60 KiB).
  SIZE_LIMIT: "61440"

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier — format check
        run: npm run format:check

      - name: Stylelint — CSS
        run: npm run lint:css

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not formatted: $unformatted"
            gofmt -d .
            exit 1
          fi
          echo "OK"

      - name: go vet
        run: go vet ./...

      - name: Build server
        run: go build -o /tmp/site-server .

      - name: HTML+CSS budget
        run: bash scripts/check-size.sh

  # Deploy only switches on once the server is ready: set the repository
  # variable DEPLOY_ENABLED=true and fill in the SSH_* secrets (see README).
  deploy:
    name: Deploy
    needs: checks
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Only SSH_HOST and SSH_PRIVATE_KEY are required. The rest fall back
      # to defaults, so there is no need to override them.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/9site' }}
      RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD || 'sudo systemctl restart 9site' }}
      TARGET: ${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}
      SSH_OPTS: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=yes
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Linux server binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o build/site-server .

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "key in place"

      - name: Upload static files
        run: |
          set -euo pipefail
          # Статика живёт в $DEPLOY_PATH/public, бинарник — в корне
          # $DEPLOY_PATH: сервис читает её по STATIC_ROOT из юнита.
          # rsync сам создаёт отсутствующий public/, но mkdir не даёт
          # первому деплою упасть по неочевидной причине, если не создаст.
          $SSH_OPTS "$TARGET" "mkdir -p '$DEPLOY_PATH/public' && chmod 755 '$DEPLOY_PATH/public'"
          rsync -avz -e "$SSH_OPTS" \
            public/index.html public/style.css public/design.html public/design.css \
            "$TARGET:$DEPLOY_PATH/public/"
          # Слои стилей копируются отдельно: --delete-after убирает файлы,
          # оставшиеся на сервере от прежней разбивки, иначе public/css
          # постепенно копит мусор, который всё равно раздаётся наружу.
          rsync -avz --delete-after -e "$SSH_OPTS" \
            public/css/ "$TARGET:$DEPLOY_PATH/public/css/"
          rsync -avz --delete-after -e "$SSH_OPTS" \
            public/assets/ "$TARGET:$DEPLOY_PATH/public/assets/"

      - name: Upload server binary
        run: |
          set -euo pipefail
          rsync -avz -e "$SSH_OPTS" build/site-server "$TARGET:/tmp/site-server.new"
          # Install next to the old binary and swap with mv: a rename inside
          # one filesystem is atomic, so the service never goes a moment
          # without a binary and never hits "Text file busy".
          $SSH_OPTS "$TARGET" "
            install -m 755 /tmp/site-server.new '$DEPLOY_PATH/site-server.new' &&
            mv -f '$DEPLOY_PATH/site-server.new' '$DEPLOY_PATH/site-server' &&
            rm -f /tmp/site-server.new
          "

      - name: Restart service
        run: $SSH_OPTS "$TARGET" "$RESTART_CMD"

      # Check not only that the process started but that it actually
      # responds: the site is served and the closed files stay closed.
      - name: Check that the site responds
        run: |
          set -euo pipefail

          check() {
            local url="$1" want="$2" code
            code="$($SSH_OPTS "$TARGET" "curl -s -o /dev/null -w '%{http_code}' '$url'" || true)"
            printf '  %-34s %s\n' "$url" "${code:-no response}"
            if [ "$code" != "$want" ]; then
              echo "Expected $want, got ${code:-no response}"
              return 1
            fi
          }

          check http://127.0.0.1:8080/           200
          check http://127.0.0.1:8080/style.css  200
          check http://127.0.0.1:8080/css/base.css 200
          check http://127.0.0.1:8080/design.css 200
          check http://127.0.0.1:8080/maket      200
          check http://127.0.0.1:8080/main.go    404
          check http://127.0.0.1:8080/visits.dat 404
          check http://127.0.0.1/                200

      # The counter is the only live part of the site, so check the number
      # itself rather than the status code: it has to grow on every request.
      - name: Check the visit counter
        run: |
          set -euo pipefail

          # Each call is exactly one request to the main page, so the number
          # inside .counter must increase by one.
          visits() {
            $SSH_OPTS "$TARGET" "curl -s http://127.0.0.1:8080/" \
              | tr -d '\n' \
              | awk -F'class="counter"' '{print $2}' \
              | head -c 200 \
              | grep -o '<span>[0-9]</span>' | grep -o '[0-9]' | tr -d '\n'
          }

          first="$(visits)"
          second="$(visits)"
          printf '  before: %s, after: %s\n' "$first" "$second"

          if [ -z "$first" ] || [ -z "$second" ]; then
            echo "Counter not found in the response"
            exit 1
          fi

          # 10# keeps bash from reading leading zeros as octal and failing
          # on a number like 008.
          diff=$((10#$second - 10#$first))
          if [ "$diff" != "1" ]; then
            echo "Expected a growth of 1, got $diff"
            exit 1
          fi
          echo "Counter is growing"

      - name: Summary
        run: echo "Deployed commit ${{ github.sha }}"
