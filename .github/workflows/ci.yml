name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # HTML+CSS budget in bytes (64 KiB). Raised from 60 KiB for the studio
  # button on the main page (css/studio-link.css).
  SIZE_LIMIT: "65536"

# Checks are split per toolchain so one red job names the culprit instead
# of a single serial "Checks" run: format, css, ts, go, shell, budget.
# Each job owns exactly one tool and pays its setup only once.
jobs:
  # Prettier is one tool for html, css, ts, json, md and yaml, and its
  # ignore list is tuned for the whole repo. Splitting it per language
  # would pay setup-node and npm ci three times over and still need a
  # second job for the json/md/yaml tail, so it stays whole.
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

  css:
    name: CSS (Stylelint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stylelint
        run: npm run lint:css

  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint:ts

      - name: Rebuild check
        run: |
          npm run build:ts
          if [ -n "$(git status --porcelain public/js/)" ]; then
            echo "Compiled public/js/ does not match src/: run npm run build:ts"
            git status --porcelain public/js/
            exit 1
          fi
          echo "OK"

  # Диагностика сверх go vet: errcheck, staticcheck, ineffassign,
  # unused, gocritic, misspell (.golangci.yml).
  #
  # -race обязателен: бэкенд теперь весь параллелённый (атомик счётчика,
  # мьютексы лимитера, WAL), гонку ловит только эта проверка.
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          # gofmt идёт по git-файлам: в ./... попадает Go-пакет
          # библиотеки flatted внутри node_modules — чужой код не гоняем.
          # xargs -0 -r вместо $(): без него пайп с пустым вводом молча
          # запускал бы gofmt без аргументов, а опечатка в git ls-files
          # при set -e больше не проходила бы мимо.
          unformatted="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Not formatted: $unformatted"
            git ls-files -z '*.go' | xargs -0 -r gofmt -d
            exit 1
          fi
          echo "OK"

      - name: go vet
        run: |
          set -euo pipefail
          go list ./... | grep -v node_modules | xargs -r go vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

      # Неблокирующая проверка: новая уязвимость в транзитивной
      # зависимости не должна держать деплой заложником до фикса,
      # который мы не контролируем. Смотрим в логах и чиним отдельно.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: go test
        run: |
          set -euo pipefail
          go list ./... | grep -v node_modules | xargs -r go test -race

      - name: Build server
        run: go build -o /tmp/site-server ./server

  # Оба чека — обычный bash, ни node, ни Go тут не нужны.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The shell linters need nothing from npm or go: they look at scripts and
      # workflows.
      - name: Install shell linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck bats
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: shellcheck for the deploy scripts
        run: |
          shellcheck -S warning \
            scripts/*.sh deploy/*.sh deploy/remote/*.sh deploy/tests/fakessh

      # The workflows plus the behaviour of the deploy scripts with stubbed
      # server commands.
      - name: Deploy checks
        run: bash scripts/check-deploy.sh

  # Считает main page: index.html и слои стилей из public/css.
  # Слои макета (public/css/design/) в бюджет не входят.
  size:
    name: HTML+CSS budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Budget check
        run: bash scripts/check-size.sh

  # Full rehearsal of the deploy on a real systemd, as the deploy user over
  # ssh, with no sudo at all: root is only what a GitHub runner already has
  # and it stays inside the job. Kept off the deploy gate on purpose: it must
  # run so drift shows up, but a flaky rehearsal should not block a deploy
  # that is otherwise green. Flip it into deploy.needs once it proves stable.
  e2e:
    name: Deploy e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the deploy end to end on user systemd
        run: sudo bash deploy/tests/e2e/run.sh

  # Deploy only switches on once the server is ready: set the repository
  # variable DEPLOY_ENABLED=true and fill in the SSH_* secrets (see README).
  deploy:
    name: Deploy
    needs: [format, css, ts, go, shell, size]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # A newer push must not cancel a deploy in flight: it would cut rsync or
    # a restart in half and leave the server with a new binary and old
    # static files. The next deploy simply waits.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # Only SSH_HOST and SSH_PRIVATE_KEY are required. The rest fall back
      # to defaults, so there is no need to override them.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/9site' }}
      # Must match DATA_DIR from 9site.service: the path of the database for
      # the snapshot taken before the restart.
      DATA_DIR: ${{ secrets.DATA_DIR || '/var/lib/9site' }}
      RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD || 'systemctl --user restart 9site' }}
      TARGET: ${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}
      SSH_OPTS: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=yes
      # Goes to the job summary on failure, so the reason is on the Checks
      # tab instead of somewhere in the log.
      SUMMARY: ${{ github.workspace }}/deploy-summary.txt
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux server binary
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o build/site-server ./server

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "key in place"

      - name: Upload static files
        run: bash deploy/upload-static.sh

      # The deploy user prepares its own runtime: the unit directory and the
      # linger that keeps the user manager up. No root, so a fresh server is
      # ready without a human beyond the one-time deploy/migrate.sh.
      - name: Prepare the user runtime
        run: bash deploy/remote/run.sh prepare "DATA_DIR=$DATA_DIR" \
          "DEPLOY_PATH=$DEPLOY_PATH" | tee -a "$SUMMARY"

      - name: Check the state of the server
        run: bash deploy/remote/run.sh preflight "DATA_DIR=$DATA_DIR" \
          "DEPLOY_PATH=$DEPLOY_PATH" | tee -a "$SUMMARY"

      - name: Install service unit
        run: |
          set -euo pipefail
          rsync -az -e "$SSH_OPTS" deploy/9site.service "$TARGET:/tmp/9site.service"
          bash deploy/remote/run.sh install-unit "DEPLOY_PATH=$DEPLOY_PATH" \
            "DATA_DIR=$DATA_DIR" | tee -a "$SUMMARY"

      - name: Upload server binary
        id: swap
        run: |
          set -euo pipefail
          rsync -az -e "$SSH_OPTS" build/site-server "$TARGET:/tmp/site-server.new"
          bash deploy/remote/run.sh swap-binary "DEPLOY_PATH=$DEPLOY_PATH" \
            | tee -a "$SUMMARY"
          echo "swapped=true" >> "$GITHUB_OUTPUT"

      - name: Backup database before restart
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          bash deploy/remote/run.sh backup-db "STAMP=$stamp" \
            "DATA_DIR=$DATA_DIR" "DEPLOY_PATH=$DEPLOY_PATH" | tee -a "$SUMMARY"

      - name: Dry-run new binary before restart
        run: bash deploy/remote/run.sh dry-run "DEPLOY_PATH=$DEPLOY_PATH" \
          | tee -a "$SUMMARY"

      - name: Restart service
        run: bash deploy/remote/run.sh restart "RESTART_CMD=$RESTART_CMD"

      - name: Check that the site answers
        run: |
          set -euo pipefail
          urls="$(grep -v '^#' deploy/smoke-urls.txt)"
          bash deploy/remote/run.sh check-live "URLS=$urls" \
            "BASE_URL=http://127.0.0.1:8080/" | tee -a "$SUMMARY"

      # --- automatic rollback -------------------------------------------
      # Everything after the swap that failed should be undone: restore the
      # previous binary, restore the database it may have migrated, restart.
      # The rejected binary stays behind as site-server.failed so the commit
      # can be reproduced locally.

      - name: Capture the journal on failure
        if: failure() && steps.swap.outputs.swapped == 'true'
        run: |
          set -euo pipefail
          bash deploy/remote/run.sh journal-report | tee -a "$SUMMARY"

      - name: Roll back binary and database
        if: failure() && steps.swap.outputs.swapped == 'true'
        run: bash deploy/remote/run.sh rollback "DATA_DIR=$DATA_DIR" \
          "DEPLOY_PATH=$DEPLOY_PATH" "RESTART_CMD=$RESTART_CMD" \
          | tee -a "$SUMMARY"

      - name: Check that the site answers after the rollback
        if: failure() && steps.swap.outputs.swapped == 'true'
        run: |
          set -euo pipefail
          bash deploy/remote/run.sh check-site \
            "BASE_URL=http://127.0.0.1:8080/" | tee -a "$SUMMARY"

      - name: Summary
        run: echo "Deployed commit ${{ github.sha }}"
