name: Rollback

# Ручной откат прод-сервера на предыдущий бинарник (site-server.prev).
# Нужен, когда deploy упал после свапа бинарника, а прямого SSH к серверу
# нет: GitHub Actions — тот же доступ, что у деплоя.
#
# Порядок важен: сначала журнал (диагноз, почему новый бинарник падает —
# он остаётся в логе прогона), потом откат, потом проверки. Если .prev
# нет (первый деплой), откат падает явно, ничего не трогая.
#
# concurrency тем же group, что у деплоя: откат не должен бежать
# параллельно с деплоем — они дерутся за один сервер.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback to previous binary
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/9site' }}
      RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD || 'sudo systemctl restart 9site' }}
      TARGET: ${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}
      SSH_OPTS: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=yes
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "key in place"

      # Диагноз до отката: почему новый бинарник падает («стоп: …» из
      # stderr). Без этого откат лечит следствие, а причина остаётся.
      - name: Capture service logs before rollback
        run: |
          set -euo pipefail
          $SSH_OPTS "$TARGET" \
            "sudo systemctl status 9site --no-pager -l -n 20 || true; \
             echo '--- journalctl ---'; \
             sudo journalctl -u 9site -n 120 --no-pager || true"

      - name: Roll back to previous binary
        run: |
          set -euo pipefail
          $SSH_OPTS "$TARGET" "
            set -eu
            if [ ! -f '$DEPLOY_PATH/site-server.prev' ]; then
              echo 'site-server.prev отсутствует — откатывать не на что (первый деплой?)' >&2
              exit 1
            fi
            mv -f '$DEPLOY_PATH/site-server' '$DEPLOY_PATH/site-server.failed'
            mv -f '$DEPLOY_PATH/site-server.prev' '$DEPLOY_PATH/site-server'
            echo 'бинарник откатан, отвергнутый сохранён как site-server.failed'
          "

      - name: Restart service
        run: $SSH_OPTS "$TARGET" "$RESTART_CMD"

      # Тот же ретрай, что в deploy: во время паузы RestartSec состояние
      # «activating» — чеку даём осесть, а при провале вываливаем журнал.
      - name: Check that the service is active
        run: |
          set -euo pipefail
          state=""
          for _ in 1 2 3 4 5; do
            state="$($SSH_OPTS "$TARGET" "sudo systemctl is-active 9site" || true)"
            if [ "$state" = "active" ]; then
              break
            fi
            sleep 2
          done
          echo "service state: $state"
          if [ "$state" != "active" ]; then
            echo "Сервис не active — status и журнал:"
            $SSH_OPTS "$TARGET" \
              "sudo systemctl status 9site --no-pager -l -n 20 || true; \
               echo '--- journalctl ---'; \
               sudo journalctl -u 9site -n 80 --no-pager || true"
            exit 1
          fi

      - name: Check that the site responds
        run: |
          set -euo pipefail

          check() {
            local url="$1" want="$2" code
            code="$($SSH_OPTS "$TARGET" "curl -s -o /dev/null -w '%{http_code}' '$url'" || true)"
            printf '  %-34s %s\n' "$url" "${code:-no response}"
            if [ "$code" != "$want" ]; then
              echo "Expected $want, got ${code:-no response}"
              return 1
            fi
          }

          # Тот же набор, что в deploy: откат считается успешным, только
          # если вернулся не просто процесс, а весь сайт — со статикой,
          # витриной и закрытым разделом.
          check http://127.0.0.1:8080/           200
          check http://127.0.0.1:8080/style.css  200
          check http://127.0.0.1:8080/css/base.css 200
          check http://127.0.0.1:8080/maket      200
          check http://127.0.0.1:8080/catalog    200
          check http://127.0.0.1:8080/print.css  200
          check http://127.0.0.1:8080/js/main.js 200
          check http://127.0.0.1:8080/studio            200
          check http://127.0.0.1:8080/vault             303
          check http://127.0.0.1:8080/css/auth/auth.css 200
          check http://127.0.0.1:8080/css/              404
          check http://127.0.0.1:8080/var/site.db       404
          check http://127.0.0.1:8080/main.go           404

      # Счётчик — единственная живая часть: проверяем число, а не код.
      - name: Check the visit counter
        run: |
          set -euo pipefail
          visits() {
            $SSH_OPTS "$TARGET" "curl -s http://127.0.0.1:8080/" \
              | tr -d '\n' \
              | awk -F'class="counter"' '{print $2}' \
              | head -c 200 \
              | grep -o '<span>[0-9]</span>' | grep -o '[0-9]' | tr -d '\n'
          }
          first="$(visits)"
          second="$(visits)"
          printf '  before: %s, after: %s\n' "$first" "$second"
          if [ -z "$first" ] || [ -z "$second" ]; then
            echo "Counter not found in the response"
            exit 1
          fi
          before=$((10#$first))
          after=$((10#$second))
          if [ "$after" -lt "$before" ]; then
            echo "Counter went down: $before -> $after"
            exit 1
          fi
          echo "Counter is growing"

      - name: Summary
        run: echo "Rolled back to previous binary on commit ${{ github.sha }} of this workflow"
