name: Rollback

# Manual rollback of the production server to the previous binary
# (site-server.prev). It is needed when the deploy failed after the binary
# swap and there is no direct ssh to the server: GitHub Actions is then the
# same access the deploy had.
#
# The order matters: journal first (the diagnosis of why the new binary
# fails, which stays in the run log), then the rollback, then the checks.
# The rollback itself is deploy/remote/rollback.sh, the same script the
# deploy runs automatically, so the two cannot drift apart.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    name: Rollback to previous binary
    runs-on: ubuntu-latest
    environment: production
    # The same group as the deploy: a rollback must not run next to a
    # deploy, they fight over one server.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || 'deploy' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/9site' }}
      # Must match DATA_DIR from 9site.service: the copy of the database for
      # the rollback that is paired with the binary.
      DATA_DIR: ${{ secrets.DATA_DIR || '/var/www/9site/var' }}
      RESTART_CMD: ${{ vars.DEPLOY_RESTART_CMD || 'systemctl --user restart 9site' }}
      TARGET: ${{ secrets.SSH_USER || 'deploy' }}@${{ secrets.SSH_HOST }}
      SSH_OPTS: ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }} -o StrictHostKeyChecking=yes
      SUMMARY: ${{ github.workspace }}/rollback-summary.txt
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "key in place"

      # Diagnosis before the rollback: why the new binary failed ("стоп: ..."
      # from its stderr). Without it the rollback treats the symptom and the
      # cause stays invisible.
      - name: Capture the journal before the rollback
        run: |
          set -euo pipefail
          bash deploy/remote/run.sh preflight "DATA_DIR=$DATA_DIR" \
            "DEPLOY_PATH=$DEPLOY_PATH" | tee -a "$SUMMARY"
          bash deploy/remote/run.sh journal-report | tee -a "$SUMMARY"

      - name: Roll back binary and database
        run: bash deploy/remote/run.sh rollback "DATA_DIR=$DATA_DIR" \
          "DEPLOY_PATH=$DEPLOY_PATH" "RESTART_CMD=$RESTART_CMD"

      # The same check the deploy runs, from the same list of urls: a
      # rollback counts as done only when the whole site is back, not just
      # a process.
      - name: Check that the site answers
        run: |
          set -euo pipefail
          urls="$(grep -v '^#' deploy/smoke-urls.txt)"
          bash deploy/remote/run.sh check-live "URLS=$urls" \
            "BASE_URL=http://127.0.0.1:8080/" | tee -a "$SUMMARY"

      - name: Summary
        run: echo "Rolled back to the previous binary on commit ${{ github.sha }} of this workflow"
